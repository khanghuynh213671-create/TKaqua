<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TK POS">
<title>TK aqua POS — Bán Hàng & Chấm Công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #090b08;
  --bg-card: #131710;
  --bg-elevated: #1a1f16;
  --text: #f0f2eb;
  --text-muted: #8e9982;
  --accent: #9ab366;
  --accent-light: rgba(154, 179, 102, 0.16);
  --border: rgba(154, 179, 102, 0.28);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --danger: #ff5252;
  --warn: #ffcc00;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: 'Roboto', -apple-system, sans-serif; height: 100%; overflow: hidden;
  user-select: none;
}

.auth-overlay {
  position: fixed; inset: 0; background: radial-gradient(circle at 50% 25%, #182014 0%, #080a07 100%);
  z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 18px;
}
.auth-box {
  width: 100%; max-width: 360px; background: var(--bg-card); border: 1.5px solid var(--border);
  border-radius: 24px; padding: 26px 20px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.9);
}
.auth-logo { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--accent); margin-bottom: 8px; }
.auth-title { font-family: 'Montserrat', sans-serif; font-size: 19px; font-weight: 900; margin-bottom: 2px; text-transform: uppercase; }
.auth-title span { color: var(--accent); }
.auth-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
.auth-form { display: flex; flex-direction: column; gap: 9px; text-align: left; }
.auth-form label { font-family: 'Montserrat', sans-serif; font-size: 10.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
.auth-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-subtle); background: #0b0d09; color: var(--text); font-size: 14px; }
.auth-input:focus { border-color: var(--accent); }
.auth-btn { width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: #111310; border: none; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 13px; text-transform: uppercase; cursor: pointer; margin-top: 4px; }
.auth-toggle { font-size: 12px; color: var(--text-muted); margin-top: 14px; cursor: pointer; text-decoration: underline; text-align: center; }
.auth-error { color: var(--danger); font-size: 12px; margin-top: 2px; display: none; text-align: center; }

.pos-app { display: flex; flex-direction: column; height: 100dvh; max-width: 1400px; margin: 0 auto; }

.pos-header {
  display: flex; flex-direction: column;
  padding: calc(var(--safe-top) + 8px) 12px 8px 12px;
  background: var(--bg-card); border-bottom: 1px solid var(--border-subtle);
  gap: 8px; flex-shrink: 0;
}
.header-top { display: flex; align-items: center; justify-content: space-between; }
.pos-brand { display: flex; align-items: center; gap: 8px; }
.pos-brand img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent); }
.pos-brand-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 14px; text-transform: uppercase; }
.pos-brand-title span { color: var(--accent); }

.role-badge { font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 900; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; }
.role-badge.sep { background: #ffcc00; color: #111310; }
.role-badge.nv { background: rgba(255,255,255,0.08); color: var(--text-muted); }

.nav-actions { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.nav-actions::-webkit-scrollbar { display: none; }
.icon-btn {
  background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text);
  height: 33px; padding: 0 10px; border-radius: 10px; font-family: 'Montserrat', sans-serif;
  font-size: 11px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.96); border-color: var(--accent); }

.pos-body { display: grid; grid-template-columns: 1fr 400px; flex: 1; min-height: 0; overflow: hidden; }
.pos-catalog { display: flex; flex-direction: column; min-height: 0; }
.pos-controls { padding: 8px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.search-box { position: relative; width: 100%; }
.search-box input {
  width: 100%; height: 42px; padding: 0 36px 0 14px; border-radius: 12px;
  border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text); font-size: 14px;
}
.search-box input:focus { border-color: var(--accent); }
.clear-search { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px; }

.source-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.source-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border-subtle);
  background: var(--bg-card); color: var(--text-muted); font-family: 'Montserrat', sans-serif;
  font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; cursor: pointer; flex-shrink: 0;
}
.tab-btn.active { background: var(--accent); color: #111310; border-color: var(--accent); }

.pos-grid {
  flex: 1; overflow-y: auto; padding: 8px 12px 110px 12px;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start;
}
.pos-item {
  background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
  padding: 8px; display: flex; flex-direction: column; cursor: pointer; position: relative;
}
.pos-item:active { transform: scale(0.96); border-color: var(--accent); }
.pos-item.out { opacity: 0.35; filter: grayscale(0.8); }
.pos-item-pic { aspect-ratio: 4 / 3; background: #060705; border-radius: 10px; overflow: hidden; position: relative; margin-bottom: 6px; }
.pos-item-pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.stock-tag {
  position: absolute; top: 5px; right: 5px; background: rgba(9, 11, 8, 0.9);
  color: var(--accent); border: 1px solid var(--border); padding: 2px 6px; border-radius: 6px;
  font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 800;
}
.stock-tag.zero { color: var(--danger); border-color: rgba(255,82,82,0.4); }
.in-cart-badge {
  position: absolute; top: 5px; left: 5px; background: var(--accent); color: #111310;
  width: 22px; height: 22px; border-radius: 50%; font-family: 'Montserrat', sans-serif;
  font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center;
}
.pos-item-name {
  font-family: 'Montserrat', sans-serif; font-size: 12.5px; font-weight: 800; color: var(--text);
  line-height: 1.3; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pos-item-meta { font-size: 10.5px; color: var(--text-muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos-item-price { margin-top: auto; font-family: 'Montserrat', sans-serif; font-size: 13.5px; font-weight: 900; color: var(--accent); }

.pos-bill {
  background: var(--bg-card); display: flex; flex-direction: column; min-height: 0; z-index: 50;
  border-left: 1px solid var(--border-subtle);
}
.bill-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);
  display: flex; justify-content: space-between; align-items: center;
}
.bill-header h3 { margin: 0; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 900; color: var(--accent); text-transform: uppercase; }
.btn-clear-bill { background: transparent; border: 1px solid rgba(255,82,82,0.35); color: var(--danger); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }

.bill-items { flex: 1; overflow-y: auto; padding: 8px 14px; }
.bill-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--border-subtle); }
.bill-row-info { flex: 1; min-width: 0; }
.bill-row-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; color: var(--text); }
.bill-row-sub { font-size: 11.5px; color: var(--text-muted); }
.bill-qty-ctrl { display: flex; align-items: center; gap: 6px; }
.q-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #0c0e0a; color: var(--accent); font-weight: 900; font-size: 15px; cursor: pointer; }
.q-val { min-width: 22px; text-align: center; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px; }

.bill-footer {
  padding: 12px 14px calc(var(--safe-bottom) + 14px); background: #0d100b;
  border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
}
.pos-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pos-input, .pos-select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text); font-size: 13px; }
.pos-input:focus, .pos-select:focus { border-color: var(--accent); }
.calc-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); }
.calc-line.grand { font-family: 'Montserrat', sans-serif; font-size: 15.5px; font-weight: 900; color: var(--text); padding-top: 6px; border-top: 1px solid var(--border-subtle); }
.calc-line.grand b { color: var(--accent); font-size: 19px; }

.pay-actions-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
.btn-pay { padding: 13px 4px; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 11px; text-transform: uppercase; cursor: pointer; border: none; text-align: center; }
.btn-pay.cash { background: var(--bg-elevated); color: var(--text); border: 1.5px solid var(--border); }
.btn-pay.card { background: #1c2417; color: var(--accent); border: 1.5px solid var(--border); }
.btn-pay.qr { background: var(--accent); color: #111310; }

.mobile-cart-bar {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  padding: 10px 14px calc(var(--safe-bottom) + 10px);
  background: rgba(14, 18, 12, 0.96); backdrop-filter: blur(20px);
  border-top: 1.5px solid var(--border); z-index: 40; align-items: center; justify-content: space-between;
}
.mobile-cart-info b { font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 900; color: var(--accent); display: block; }
.mobile-cart-info span { font-size: 11.5px; color: var(--text-muted); }
.btn-open-bill {
  background: var(--accent); color: #111310; border: none; padding: 12px 22px;
  border-radius: 999px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 12px; text-transform: uppercase;
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: 0.2s;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 20px;
  padding: 20px 16px calc(var(--safe-bottom) + 20px); width: 92%; max-width: 440px; max-height: 88dvh; overflow-y: auto; text-align: center;
}
.modal-box h3 { margin: 0 0 10px; font-family: 'Montserrat', sans-serif; color: var(--accent); font-size: 16.5px; text-transform: uppercase; }
.receipt-box { background: #0a0c08; border: 1px dashed var(--border); border-radius: 12px; padding: 12px; text-align: left; font-size: 12.5px; margin: 10px 0; line-height: 1.6; }

/* KHU VỰC QUẢN LÝ ẢNH & VIDEO KHÔNG GIỚI HẠN */
.media-preview-container {
  display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; margin-bottom: 12px; scrollbar-width: none;
}
.media-preview-container::-webkit-scrollbar { display: none; }
.media-preview-item {
  position: relative; width: 85px; height: 85px; border-radius: 10px; overflow: hidden;
  border: 1.5px solid var(--border); flex-shrink: 0; background: #000;
}
.media-preview-item img, .media-preview-item video { width: 100%; height: 100%; object-fit: cover; }
.media-del-btn {
  position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.8); color: #ff5252;
  border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: 900; font-size: 12px; cursor: pointer;
}

@media (max-width: 860px) {
  .pos-body { grid-template-columns: 1fr; }
  .pos-bill {
    position: fixed; inset: 0; transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pos-bill.open { transform: translateY(0); }
  .mobile-cart-bar { display: flex; }
}
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <img src="logo.jpg" alt="Logo" class="auth-logo">
    <div class="auth-title">TK <span>POS</span></div>
    <div class="auth-desc" id="authModeDesc">Đăng nhập tài khoản bán hàng</div>
    <div class="auth-form">
      <div id="authNameGroup" style="display:none;">
        <label>Họ và Tên Nhân Viên</label>
        <input type="text" id="authNameInput" class="auth-input" placeholder="Nguyễn Văn A">
      </div>
      <label>Số Điện Thoại</label>
      <input type="tel" id="authPhoneInput" class="auth-input" placeholder="0901234567">
      <label>Mật Khẩu</label>
      <input type="password" id="authPassInput" class="auth-input" placeholder="Nhập mật khẩu...">
      <div class="auth-error" id="authError"></div>
      <button class="auth-btn" id="btnAuthSubmit" onclick="handleAuthAction()">Đăng Nhập</button>
    </div>
    <div class="auth-toggle" id="btnToggleAuthMode" onclick="toggleAuthMode()">Chưa có tài khoản? Đăng ký ngay</div>
  </div>
</div>

<div class="pos-app">
  <header class="pos-header">
    <div class="header-top">
      <div class="pos-brand">
        <img src="logo.jpg" alt="TK aqua">
        <div class="pos-brand-title">TK <span>POS</span></div>
      </div>
      <button class="icon-btn" onclick="showAccountMenu()">
        👤 <span id="headerUserName">Tài khoản</span>
        <span id="headerUserRole" class="role-badge nv">NV</span>
      </button>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openCheckInOutModal()">⏱️ Chấm công</button>
      <button class="icon-btn" id="btnTimesheet" onclick="openTimesheetModal()">📅 Bảng công</button>
      <button class="icon-btn" id="btnTodayOwner" onclick="openTodayReport()">📊 Hôm nay</button>
      <button class="icon-btn" onclick="reloadInventory(true)">🔄 Kho</button>
    </div>
  </header>

  <div class="pos-body">
    <section class="pos-catalog">
      <div class="pos-controls">
        <div class="search-box">
          <input type="text" id="posSearch" placeholder="Tìm tên cá, phụ kiện, size..." oninput="renderCatalog()">
          <button class="clear-search" onclick="clearSearch()">✕</button>
        </div>
        <div class="source-tabs" id="catTabs"></div>
      </div>
      <div class="pos-grid" id="posGrid"></div>
    </section>

    <aside class="pos-bill" id="posBill">
      <div class="bill-header">
        <h3>🧾 Giỏ Hàng (<span id="billCount">0</span>)</h3>
        <div style="display:flex;gap:6px;">
          <button class="btn-clear-bill" onclick="clearBill()">Xóa giỏ</button>
          <button class="icon-btn" style="height:28px;" id="btnCloseBillMobile" onclick="toggleMobileBill(false)">Đóng ↓</button>
        </div>
      </div>

      <div class="bill-items" id="billItems"></div>

      <div class="bill-footer">
        <div class="pos-field-grid">
          <input type="text" id="custName" class="pos-input" placeholder="Tên khách (Lẻ)">
          <input type="tel" id="custPhone" class="pos-input" placeholder="SĐT khách">
        </div>
        <div class="pos-field-grid">
          <select id="shipSelect" class="pos-select" onchange="updateBillTotals()">
            <option value="0" data-label="Mua tại Studio">Tại tiệm (Ship 0đ)</option>
            <option value="110000" data-label="Nội thành TP.HCM">Ship TP.HCM (+110k)</option>
            <option value="210000" data-label="Tỉnh / Xe khách">Ship Tỉnh (+210k)</option>
            <option value="500000" data-label="Máy bay / Quốc tế">Ship Bay (+500k)</option>
          </select>
          <input type="number" id="discountInput" class="pos-input" placeholder="Giảm giá (VNĐ)" oninput="updateBillTotals()">
        </div>
        <input type="text" id="orderNote" class="pos-input" placeholder="Ghi chú đơn...">
        <div class="calc-line"><span>Tiền hàng:</span><b id="lblSubTotal">0đ</b></div>
        <div class="calc-line"><span>Ship / Giảm giá:</span><b id="lblAdjust">0đ</b></div>
        <div class="calc-line grand"><span>TỔNG THU:</span><b id="lblGrandTotal">0đ</b></div>
        <div class="pay-actions-3">
          <button class="btn-pay cash" onclick="startOrderProcess('CASH')">💵 Tiền mặt</button>
          <button class="btn-pay qr" onclick="startOrderProcess('QR')">🏦 Quét QR</button>
          <button class="btn-pay card" onclick="startOrderProcess('CARD')">💳 Quẹt thẻ</button>
        </div>
      </div>
    </aside>
  </div>

  <div class="mobile-cart-bar" onclick="toggleMobileBill(true)">
    <div class="mobile-cart-info">
      <b id="mobTotal">0đ</b>
      <span id="mobCount">0 món trong giỏ</span>
    </div>
    <button class="btn-open-bill">Thanh Toán ↑</button>
  </div>
</div>

<div class="modal-overlay" id="posModal">
  <div class="modal-box" id="posModalBox"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQp8_YWn7P7HMP4k2JbLNI2gkrwATBP9zkJumK96bi2dwU8k2OM1AbAgAICyUayeZj4kqkro_nciT8N/pub?output=csv";
const ACC_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQp8_YWn7P7HMP4k2JbLNI2gkrwATBP9zkJumK96bi2dwU8k2OM1AbAgAICyUayeZj4kqkro_nciT8N/pub?gid=1785201873&single=true&output=csv";
const API_BASE = "https://tkaqua.khanghuynh213671.workers.dev";

var ALL_PRODUCTS = [];
var BILL = [];
var currentCat = "ALL";
var activePollInterval = null;
var currentPendingOrder = null;
var capturedMediaList = []; // Danh sách ảnh & video KHÔNG GIỚI HẠN
var isRegisterMode = false;
var currentUser = null;

function money(n) { return Number(n || 0).toLocaleString("vi-VN"); }
function normVN(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().trim(); }

function extractDriveId(url) {
  if (!url) return null;
  var s = url.trim();
  var m1 = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if (m1) return m1[1];
  var m2 = s.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m2) return m2[1];
  var m3 = s.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/); if (m3) return m3[1];
  return null;
}
function resolveThumbnailUrl(imgRaw, vidRaw) {
  if (imgRaw && imgRaw.trim()) {
    var id = extractDriveId(imgRaw);
    return id ? "https://lh3.googleusercontent.com/d/" + id : imgRaw.trim();
  }
  if (vidRaw && vidRaw.trim()) {
    var vidId = extractDriveId(vidRaw);
    return vidId ? "https://lh3.googleusercontent.com/d/" + vidId : "";
  }
  return "";
}

function parseCSV(str, sourceGroup, sheetTabHint) {
  var rows = [], row = [], curr = '', inQuotes = false;
  for (var i = 0; i < str.length; i++) {
    var c = str[i];
    if (inQuotes) {
      if (c === '"') { if (str[i + 1] === '"') { curr += '"'; i++; } else inQuotes = false; }
      else curr += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(curr); curr = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && str[i+1] === '\n') i++;
        row.push(curr); curr = ''; rows.push(row); row = [];
      } else curr += c;
    }
  }
  if (curr) row.push(curr);
  if (row.length > 0) rows.push(row);
  if (rows.length < 2) return [];

  var headers = rows[0].map(h => h.trim());
  var result = [];
  for (var r = 1; r < rows.length; r++) {
    if (rows[r].length < 2) continue;
    var obj = {};
    for (var j = 0; j < headers.length; j++) obj[headers[j]] = rows[r][j] ? rows[r][j].trim() : "";
    var getVal = k => { var rk = Object.keys(obj).find(x => x.replace(/\s/g, '') === k); return rk ? obj[rk] : ""; };
    var ten = getVal('TenCa') || getVal('TenSP');
    if (!ten) continue;

    result.push({
      id: sourceGroup + "_" + r,
      group: sourceGroup,
      sheetTab: sheetTabHint,
      n: ten,
      p: parseInt(getVal('Gia')) || 0,
      sl: parseInt(getVal('SoLuong')) || 0,
      cat: getVal('PhanLoai') || sourceGroup,
      s: getVal('Size'),
      img: resolveThumbnailUrl(getVal('Anh'), getVal('Video'))
    });
  }
  return result;
}

async function reloadInventory(clearSessionDeduct) {
  if (clearSessionDeduct) sessionStorage.removeItem("tka_pos_deducted");
  var list = [];
  var bust = "&_t=" + Date.now();
  try {
    var resFish = await fetch(CSV_URL + bust, { cache: "no-store" });
    list = list.concat(parseCSV(await resFish.text(), "Cá cảnh", "CaCanh"));
  } catch (e) {}
  try {
    var resAcc = await fetch(ACC_CSV_URL + bust, { cache: "no-store" });
    list = list.concat(parseCSV(await resAcc.text(), "Phụ kiện", "PhuKien"));
  } catch (e) {}

  var localDeduct = JSON.parse(sessionStorage.getItem("tka_pos_deducted") || "{}");
  list.forEach(item => {
    var key = item.n + "__" + item.s;
    if (localDeduct[key]) item.sl = Math.max(0, item.sl - localDeduct[key]);
  });

  ALL_PRODUCTS = list;
  renderCategoryTabs();
  renderCatalog();
}

function renderCategoryTabs() {
  var rawCats = ALL_PRODUCTS.map(p => p.cat).filter(Boolean);
  var uniqueCats = ["ALL", "Cá cảnh", "Phụ kiện"].concat(Array.from(new Set(rawCats)));
  uniqueCats = Array.from(new Set(uniqueCats));
  var html = "";
  uniqueCats.forEach(c => {
    var label = c === "ALL" ? "Tất cả (" + ALL_PRODUCTS.length + ")" : c;
    html += '<button class="tab-btn ' + (currentCat === c ? 'active' : '') + '" onclick="selectCat(\'' + c.replace(/'/g, "\\'") + '\')">' + label + '</button>';
  });
  document.getElementById("catTabs").innerHTML = html;
}

window.selectCat = function(c) { currentCat = c; renderCategoryTabs(); renderCatalog(); };
window.clearSearch = function() { document.getElementById("posSearch").value = ""; renderCatalog(); };

function renderCatalog() {
  var q = normVN(document.getElementById("posSearch").value);
  var filtered = ALL_PRODUCTS.filter(item => {
    var matchCat = (currentCat === "ALL" || item.cat === currentCat || item.group === currentCat);
    var matchQ = !q || normVN(item.n).indexOf(q) > -1 || normVN(item.cat).indexOf(q) > -1 || normVN(item.s).indexOf(q) > -1;
    return matchCat && matchQ;
  });

  filtered.sort((a, b) => (b.sl > 0 ? 1 : 0) - (a.sl > 0 ? 1 : 0));

  var html = "";
  filtered.forEach(item => {
    var inBill = BILL.find(b => b.id === item.id);
    var isOut = item.sl <= 0;
    html += '<div class="pos-item ' + (isOut ? 'out' : '') + '" onclick="tapProduct(\'' + item.id + '\')">'
      + '<div class="pos-item-pic">'
      + (item.img ? '<img src="' + item.img + '" alt="' + item.n + '" loading="lazy">' : '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:20px;">🐟</div>')
      + (inBill ? '<div class="in-cart-badge">' + inBill.qty + '</div>' : '')
      + '<span class="stock-tag ' + (isOut ? 'zero' : '') + '">' + (isOut ? 'Hết hàng' : 'Kho: ' + item.sl) + '</span>'
      + '</div>'
      + '<div class="pos-item-name">' + item.n + '</div>'
      + '<div class="pos-item-meta">' + item.cat + (item.s ? ' · ' + item.s : '') + '</div>'
      + '<div class="pos-item-price">' + money(item.p) + 'đ</div>'
      + '</div>';
  });
  document.getElementById("posGrid").innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Không tìm thấy sản phẩm.</div>';
}

window.tapProduct = function(id) {
  var prod = ALL_PRODUCTS.find(p => p.id === id);
  if (!prod || prod.sl <= 0) return;
  var existing = BILL.find(b => b.id === id);
  if (existing) {
    if (existing.qty + 1 > prod.sl) {
      alert("Sản phẩm [" + prod.n + "] chỉ còn " + prod.sl + " trong kho!");
      return;
    }
    existing.qty++;
  } else {
    BILL.push({ id: prod.id, n: prod.n, s: prod.s, p: prod.p, qty: 1, maxSl: prod.sl, group: prod.group, sheetTab: prod.sheetTab });
  }
  if (navigator.vibrate) navigator.vibrate(20);
  renderBill();
  renderCatalog();
};

window.changeBillQty = function(idx, delta) {
  var item = BILL[idx];
  if (!item) return;
  var nQty = item.qty + delta;
  if (nQty <= 0) BILL.splice(idx, 1);
  else if (nQty > item.maxSl) alert("Số lượng vượt quá tồn kho!");
  else item.qty = nQty;
  renderBill();
  renderCatalog();
};

function getTotals() {
  var tienHang = BILL.reduce((sum, b) => sum + b.p * b.qty, 0);
  var tongSL = BILL.reduce((sum, b) => sum + b.qty, 0);
  var shipSel = document.getElementById("shipSelect");
  var phiShip = parseInt(shipSel.value) || 0;
  var shipLabel = shipSel.options[shipSel.selectedIndex].getAttribute("data-label");
  var giamGia = parseInt(document.getElementById("discountInput").value) || 0;
  var tongCong = Math.max(0, tienHang + phiShip - giamGia);
  return { tienHang, tongSL, phiShip, shipLabel, giamGia, tongCong };
}

window.updateBillTotals = function() {

// HÓA ĐƠN 72MM CHUẨN IOS SAFARI
function generateReceipt72mmBase64(orderData) {
  try {
    var W = 576;
    var items = (orderData && Array.isArray(orderData.rawItems)) ? orderData.rawItems : [];
    var H = 450 + (items.length * 52) + (orderData.giam_gia > 0 ? 32 : 0) + (orderData.phi_ship > 0 ? 32 : 0);
    
    var canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#000000";

    ctx.textAlign = "center";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText("TK AQUA STUDIO", W / 2, 40);
    ctx.font = "16px sans-serif";
    ctx.fillText("Hotline / Zalo: 0703.008.005", W / 2, 70);

    function drawDash(yPos) {
      ctx.beginPath();
      ctx.setLineDash([6, 4]);
      ctx.moveTo(20, yPos);
      ctx.lineTo(W - 20, yPos);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    drawDash(90);
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("HÓA ĐƠN BÁN HÀNG", W / 2, 122);

    ctx.textAlign = "left";
    ctx.font = "16px sans-serif";
    ctx.fillText("Mã đơn: #" + orderData.ma_don, 24, 154);
    ctx.fillText("Ngày: " + orderData.thoi_gian, 24, 180);
    ctx.fillText("Thu ngân: " + orderData.nhan_vien + " | TT: " + orderData.phuong_thuc_tt, 24, 206);
    ctx.fillText("Khách hàng: " + orderData.ten_khach, 24, 232);
    drawDash(248);

    var y = 280;
    items.forEach(function(it, i) {
      ctx.textAlign = "left";
      ctx.font = "bold 16px sans-serif";
      var title = (i + 1) + ". " + it.n + (it.s ? " (" + it.s + ")" : "");
      ctx.fillText(title.slice(0, 34), 24, y);
      y += 24;

      ctx.font = "15px sans-serif";
      ctx.fillText("   SL: " + it.qty + " x " + money(it.p) + "đ", 24, y);
      ctx.textAlign = "right";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText(money(it.p * it.qty) + "đ", W - 24, y);
      y += 28;
    });

    drawDash(y);
    y += 28;

    function row(label, val, bold) {
      ctx.font = bold ? "bold 22px sans-serif" : "16px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(label, 24, y);
      ctx.textAlign = "right";
      ctx.fillText(val, W - 24, y);
      y += bold ? 34 : 26;
    }

    row("Tạm tính:", money(orderData.tien_hang) + "đ", false);
    if (orderData.phi_ship > 0) row("Phí ship:", "+" + money(orderData.phi_ship) + "đ", false);
    if (orderData.giam_gia > 0) row("Giảm giá:", "-" + money(orderData.giam_gia) + "đ", false);

    drawDash(y - 8);
    y += 16;
    row("TỔNG THU:", money(orderData.tong_tien) + " VNĐ", true);

    return canvas.toDataURL("image/jpeg", 0.85);
  } catch (err) {
    console.error("Lỗi vẽ canvas:", err);
    return null;
  }
}

window.startOrderProcess = function(method) {
  if (BILL.length === 0) return alert("Giỏ hàng đang trống!");
  var totals = getTotals();
  var staff = currentUser ? currentUser.name : "NV Tại quầy";
  var custName = document.getElementById("custName").value.trim() || "Khách lẻ";
  var custPhone = document.getElementById("custPhone").value.trim() || "0000000000";
  var note = document.getElementById("orderNote").value.trim();
  var maSo = Number(String(Date.now()).slice(-6) + String(Math.floor(10 + Math.random() * 90)));
  var maDon = "TKA-" + maSo;
  var now = new Date();
  var thoiGian = String(now.getDate()).padStart(2, "0") + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + now.getFullYear() + " " + now.toTimeString().slice(0, 8);
  var chuoiSP = BILL.map(b => b.n + (b.s ? " (" + b.s + ")" : "") + " x" + b.qty).join(", ");
  var pmText = method === "CASH" ? "Tiền mặt" : (method === "CARD" ? "Quẹt thẻ" : "Chuyển khoản");

  currentPendingOrder = {
    ma_don: maDon, orderCodeNum: maSo, thoi_gian: thoiGian, nhan_vien: staff,
    ten_khach: custName, so_dien_thoai: custPhone, dia_chi: note || totals.shipLabel,
    phuong_thuc_ship: totals.shipLabel, phuong_thuc_tt: pmText, phi_ship: totals.phiShip,
    giam_gia: totals.giamGia, tien_hang: totals.tienHang, tong_so_luong: totals.tongSL,
    tong_tien: totals.tongCong, chi_tiet_sp: chuoiSP,
    ghi_chu: "POS (" + staff + ")" + (totals.giamGia > 0 ? " | Giảm: " + money(totals.giamGia) + "đ" : "") + (note ? " | " + note : ""),
    method, rawItems: BILL.map(x => Object.assign({}, x))
  };

  capturedMediaList = [];
  renderOrderCheckModal();
};

function renderOrderCheckModal() {

    return '<div class="media-preview-item">' +
      (m.type === "video"

        : '<img src="' + m.dataUrl + '">') +

window.handleOrderPhotoAdd = function(e) {
  var files = Array.from(e.target.files);
  if (!files || files.length === 0) return;

  var readCount = 0;
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(evt) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement("canvas");
        var MAX = 800;
        var w = img.width, h = img.height;
        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
        else { if (h > MAX) { w *= MAX / h; h = MAX; } }
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(10, h - 30, w - 20, 22);
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif";
        ctx.fillText("TK POS · " + currentPendingOrder.ma_don + " · " + new Date().toLocaleTimeString("vi-VN"), 14, h - 15);
        
        capturedMediaList.push({ type: "image", dataUrl: canvas.toDataURL("image/jpeg", 0.75) });
        readCount++;
        if (readCount === files.length) {
          renderOrderCheckModal();
        }
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = "";
};

window.handleOrderVideoAdd = function(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) {
    alert("Video quá lớn (Vui lòng quay dưới 8MB để gửi mượt mà)!");
    return;
  }
  var reader = new FileReader();
  reader.onload = function(evt) {
    capturedMediaList.push({ type: "video", dataUrl: evt.target.result });
    renderOrderCheckModal();
  };
  reader.readAsDataURL(file);
  e.target.value = "";
};

window.removeMediaItem = function(idx) {
  capturedMediaList.splice(idx, 1);
  renderOrderCheckModal();
};

window.executeOrderProcess = async function() {
  if (capturedMediaList.length === 0) return alert("Vui lòng chụp ít nhất 1 ảnh hoặc quay video!");
  var orderData = currentPendingOrder;

  if (orderData.method === "CASH" || orderData.method === "CARD") {
    showPosModal(`
      <h3>${orderData.method === "CASH" ? "💵 Thu Tiền Mặt" : "💳 Quẹt Thẻ"}</h3>
      <p style="margin:4px 0 12px;font-size:13px;color:var(--text-muted);">Đơn #${orderData.ma_don} · Cần thu: <b style="color:var(--accent);font-size:17px;">${money(orderData.tong_tien)}đ</b></p>
      <div style="display:flex;gap:8px;">
        <button class="btn-pay cash" style="flex:1;" onclick="closePosModal()">Hủy</button>
        <button class="btn-pay qr" style="flex:1;" onclick="completeAndEmitReceipt(currentPendingOrder)">Hoàn tất &amp; Xuất Bill</button>
      </div>
    `);
    return;
  }

  showPosModal('<h3>⏳ Đang tạo mã VietQR...</h3>');
  try {
    var payRes = await fetch(API_BASE + "/api/create-payment", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderCode: orderData.orderCodeNum, amount: orderData.tong_tien, description: "POS " + orderData.ma_don })
    });
    var payData = (await payRes.json()).data;
    var qrImg = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=6&data=" + encodeURIComponent(payData.qrCode || "");

    showPosModal(`
      <h3>🏦 Chuyển Khoản VietQR</h3>
      <div style="background:#fff;padding:8px;border-radius:12px;display:inline-block;margin:8px 0;"><img src="${qrImg}" style="width:200px;height:200px;display:block;"></div>
      <div style="font-family:'Montserrat',sans-serif;font-size:19px;font-weight:900;color:var(--warn);">${money(orderData.tong_tien)}đ</div>
      <div id="posQrStatus" style="padding:6px;border-radius:999px;background:var(--accent-light);color:var(--accent);font-size:11.5px;font-weight:700;margin:8px 0;">⏳ Tự xuất hóa đơn khi tiền về...</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-pay cash" style="flex:1;" onclick="closePosModal()">Hủy</button>
        <button class="btn-pay qr" style="flex:1;" onclick="completeAndEmitReceipt(currentPendingOrder)">Đã nhận tiền</button>
      </div>
    `);

    var done = false;
    activePollInterval = setInterval(async () => {
      if (done) return;
      try {
        var r = await fetch(API_BASE + "/api/check-payment?orderCode=" + orderData.orderCodeNum + "&t=" + Date.now(), { cache: "no-store" });
        var j = await r.json();
        if (j && j.data && (j.data.status === "PAID" || (j.data.amount > 0 && j.data.amountPaid >= j.data.amount))) {
          done = true; clearInterval(activePollInterval);
          await completeAndEmitReceipt(orderData);
        }
      } catch (e) {}
    }, 2200);
  } catch (err) { alert("Lỗi QR: " + err.message); }
};

window.completeAndEmitReceipt = async function(orderData) {
  var receiptBase64 = generateReceipt72mmBase64(orderData);

  // 1. Gửi dữ liệu về Google Sheet
  fetch(API_BASE + "/api/pos-sync", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "pos_sale",
      ma_don: orderData.ma_don, thoi_gian: orderData.thoi_gian, nhan_vien: orderData.nhan_vien,
      ten_khach: orderData.ten_khach, so_dien_thoai: orderData.so_dien_thoai,
      phuong_thuc_tt: orderData.phuong_thuc_tt, chi_tiet_sp: orderData.chi_tiet_sp,
      tong_so_luong: orderData.tong_so_luong, giam_gia: orderData.giam_gia,
      phi_ship: orderData.phi_ship, tong_tien: orderData.tong_tien, ghi_chu: orderData.ghi_chu
    })
  }).catch(function(e) { console.error("Sheet Sync Error:", e); });

  // 2. Gửi Hóa đơn và TẤT CẢ ảnh / video lên Discord Webhook
  var notifyPayload = {
    is_pos: true,
    content: `🧾 **[TK POS] HÓA ĐƠN #${orderData.ma_don} (${String(orderData.phuong_thuc_tt).toUpperCase()})**`,
    embeds: [{
      title: "HÓA ĐƠN 72MM #" + orderData.ma_don,
      color: 5763719,
      fields: [
        { name: "Thu ngân", value: orderData.nhan_vien, inline: true },
        { name: "Khách hàng", value: orderData.ten_khach, inline: true },
        { name: "Phương thức", value: orderData.phuong_thuc_tt, inline: true },
        { name: "Sản phẩm", value: orderData.chi_tiet_sp, inline: false },
        { name: "TỔNG THU", value: "**" + money(orderData.tong_tien) + " VNĐ**", inline: true }
      ]
    }],
    receipt_base64: receiptBase64,
    media_list: capturedMediaList
  };

  fetch(API_BASE + "/api/notify", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(notifyPayload)
  }).catch(function(e) { console.error("Discord Error:", e); });

  clearBill();

  showPosModal(`
    <h3>✅ ĐÃ HOÀN TẤT ĐƠN HÀNG</h3>
    <div style="max-height:300px;overflow-y:auto;background:#fff;padding:6px;border-radius:12px;margin:10px 0;border:1px solid var(--border);">

var capturedCheckinPhoto = null;

window.openCheckInOutModal = function() {
  if (!currentUser) return alert("Vui lòng đăng nhập trước khi chấm công!");
  capturedCheckinPhoto = null;
  showPosModal(`

    <p style="font-size:12px;color:var(--text-muted);margin:0 0 10px;">Chụp ảnh tại tiệm để ghi nhận giờ làm vào Google Sheet &amp; Discord.</p>
    <input type="file" id="chkCam" accept="image/*" capture="user" style="display:none;" onchange="handleCheckinCapture(event)">
    <button class="btn-pay qr" onclick="document.getElementById('chkCam').click()" style="width:100%;padding:13px;margin-bottom:10px;">📸 Mở Camera Chụp Ảnh</button>
    <div id="chkPhotoPrev" style="display:none;margin-bottom:10px;">
      <img id="chkPhotoImg" style="max-width:100%;max-height:160px;border-radius:12px;border:1px solid var(--border);">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button class="btn-pay qr" id="btnDoCheckin" disabled onclick="submitCheckInOut('IN')">🟢 Vào Ca</button>
      <button class="btn-pay cash" id="btnDoCheckout" disabled onclick="submitCheckInOut('OUT')">🔴 Hết Ca</button>
    </div>
  `);
};

window.handleCheckinCapture = function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(evt) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var MAX = 800;
      var w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
      else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(10, h - 30, w - 20, 22);
      ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif";
      ctx.fillText(currentUser.name + " (" + currentUser.phone + ") · " + new Date().toLocaleString("vi-VN"), 14, h - 15);

      capturedCheckinPhoto = canvas.toDataURL("image/jpeg", 0.75);
      document.getElementById("chkPhotoImg").src = capturedCheckinPhoto;
      document.getElementById("chkPhotoPrev").style.display = "block";
      document.getElementById("btnDoCheckin").disabled = false;
      document.getElementById("btnDoCheckout").disabled = false;
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

window.submitCheckInOut = async function(type) {
  if (!capturedCheckinPhoto) return alert("Vui lòng chụp ảnh xác nhận trước!");
  var btnIn = document.getElementById("btnDoCheckin");
  var btnOut = document.getElementById("btnDoCheckout");
  btnIn.disabled = true; btnOut.disabled = true;

  var now = new Date();
  var todayStr = String(now.getDate()).padStart(2, "0") + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + now.getFullYear();
  var timeStr = now.toTimeString().slice(0, 8);
  var action = type === "IN" ? "pos_checkin" : "pos_checkout";

  try {
    var res = await fetch(API_BASE + "/api/pos-sync", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action, ngay: todayStr, gio: timeStr,
        ten_nhan_vien: currentUser.name, so_dien_thoai: currentUser.phone
      })
    });
    var data = await res.json();

    fetch(API_BASE + "/api/notify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        is_checkin: true,
        content: `⏰ **[CHẤM CÔNG] ${type === "IN" ? "VÀO CA (CHECK-IN)" : "HẾT CA (CHECK-OUT)"}**`,
        embeds: [{
          title: currentUser.name + " — " + (type === "IN" ? "CHECK-IN" : "CHECK-OUT"),
          color: type === "IN" ? 5763719 : 15548997,
          fields: [
            { name: "Nhân viên", value: currentUser.name + " (" + currentUser.phone + ")", inline: true },
            { name: "Thời gian", value: timeStr + " — " + todayStr, inline: true },
            { name: "Số giờ làm ca này", value: type === "OUT" ? (data.so_gio + " giờ") : "Đang làm việc", inline: false }
          ]
        }],
        image_base64: capturedCheckinPhoto
      })
    }).catch(() => {});

    showPosModal(`
      <h3>✅ ${type === "IN" ? "Check-in Thành Công" : "Check-out Thành Công"}</h3>
      <p style="font-size:13px;color:var(--text-muted);">${currentUser.name} lúc <b>${timeStr}</b> ngày <b>${todayStr}</b></p>
      ${type === "OUT" ? `<div style="font-size:17px;font-weight:900;color:var(--accent);margin:10px 0;">Tổng giờ ca này: ${data.so_gio} Giờ</div>` : ''}
      <button class="btn-pay qr" style="width:100%;margin-top:10px;" onclick="closePosModal()">Đóng</button>
    `);
  } catch (err) {
    alert("Lỗi chấm công: " + err.message);
    btnIn.disabled = false; btnOut.disabled = false;
  }
};

window.openTimesheetModal = async function() {
  if (!currentUser) return alert("Vui lòng đăng nhập!");
  showPosModal('<h3>⏳ Đang tải bảng công tháng...</h3>');

  var now = new Date();
  var monthYear = String(now.getMonth() + 1).padStart(2, "0") + "/" + now.getFullYear();
  var isSep = currentUser.role === "sep";

  try {
    var res = await fetch(API_BASE + "/api/pos-sync", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "get_timesheet", thang_nam: monthYear,
        so_dien_thoai: currentUser.phone, is_sep: isSep
      })
    });
    var data = await res.json();
    var allEmps = (data && Array.isArray(data.allEmployees)) ? data.allEmployees : [];
    var logs = (data && Array.isArray(data.logs)) ? data.logs : [];

    var summaryHtml = isSep
      ? `<div class="receipt-box"><b style="color:var(--accent);">👑 TỔNG HỢP CÔNG TẤT CẢ NHÂN VIÊN (${monthYear})</b><br>` +
        (allEmps.length > 0
          ? allEmps.map(e => `<div>• <b>${e.name || 'NV'}</b> (${e.phone}): <b style="color:var(--accent);">${e.totalHours || 0} giờ</b> (${e.shifts || 0} ca)</div>`).join("")
          : '<div style="color:var(--text-muted);font-size:12px;margin-top:4px;">Chưa có dữ liệu chấm công tháng này.</div>') +
        `</div>`
      : `<div class="receipt-box" style="text-align:center;">
           <span style="font-size:11px;color:var(--text-muted);">TỔNG CÔNG THÁNG ${monthYear}</span><br>
           <b style="font-size:22px;color:var(--accent);">${data.myTotalHours || 0} GIỜ LÀM</b>
         </div>`;

    var logsHtml = logs.map(l => `
      <div style="padding:6px 0;border-bottom:1px dashed var(--border-subtle);text-align:left;font-size:12px;">
        <div style="display:flex;justify-content:space-between;"><b>${l.ngay} · ${l.ten}</b><b style="color:var(--accent);">${l.gio}h</b></div>
        <div style="color:var(--text-muted);font-size:11px;">Vào: ${l.checkin || '--'} | Ra: ${l.checkout || '--'}</div>
      </div>
    `).join("");

    showPosModal(`
      <h3>📅 Bảng Công Tháng ${monthYear}</h3>
      ${summaryHtml}
      <div style="max-height:220px;overflow-y:auto;margin:8px 0;">${logsHtml || '<p style="color:var(--text-muted);font-size:12px;">Chưa có lượt chấm công nào trong tháng.</p>'}</div>
      <button class="btn-pay qr" style="width:100%;margin-top:6px;" onclick="closePosModal()">Đóng</button>
    `);
  } catch (err) {
    alert("Không tải được bảng công: " + err.message);
    closePosModal();
  }
};

// ĐĂNG NHẬP / ĐĂNG KÝ
function showAuthErr(msg) {
  var el = document.getElementById("authError");
  el.textContent = msg; el.style.display = "block";
}

window.toggleAuthMode = function() {
  document.getElementById("authError").style.display = "none";
  isRegisterMode = !isRegisterMode;
  document.getElementById("authNameGroup").style.display = isRegisterMode ? "block" : "none";
  document.getElementById("authModeDesc").textContent = isRegisterMode ? "Đăng ký tài khoản nhân viên mới" : "Đăng nhập tài khoản bán hàng";
  document.getElementById("btnAuthSubmit").textContent = isRegisterMode ? "Tạo Tài Khoản" : "Đăng Nhập";
  document.getElementById("btnToggleAuthMode").textContent = isRegisterMode ? "Đã có tài khoản? Đăng nhập ngay" : "Chưa có tài khoản? Đăng ký ngay";
};

window.handleAuthAction = async function() {
  document.getElementById("authError").style.display = "none";
  var phone = document.getElementById("authPhoneInput").value.trim().replace(/[^0-9]/g, "");
  var pass = document.getElementById("authPassInput").value.trim();
  var name = document.getElementById("authNameInput").value.trim();

  if (!/^0[0-9]{9}$/.test(phone)) return showAuthErr("Số điện thoại gồm 10 chữ số, bắt đầu bằng số 0.");
  if (pass.length < 4) return showAuthErr("Mật khẩu ít nhất 4 ký tự.");
  if (isRegisterMode && !name) return showAuthErr("Vui lòng nhập họ và tên nhân viên.");

  var btn = document.getElementById("btnAuthSubmit");
  btn.disabled = true; btn.textContent = "ĐANG XỬ LÝ...";

  try {
    var res = await fetch(API_BASE + "/api/pos-auth", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: isRegisterMode ? "register" : "login",
        phone: phone, password: pass, name: name
      })
    });
    var data = await res.json();
    if (!res.ok || !data.ok) {
      showAuthErr(data.error || "Đăng nhập thất bại");
      btn.disabled = false; btn.textContent = isRegisterMode ? "Tạo Tài Khoản" : "Đăng Nhập";
      return;
    }
    applyUser(data.user);
  } catch (e) {
    showAuthErr("Lỗi kết nối: " + e.message);
    btn.disabled = false; btn.textContent = isRegisterMode ? "Tạo Tài Khoản" : "Đăng Nhập";
  }
};

function applyUser(u) {
  currentUser = u;
  localStorage.setItem("tka_logged_user", JSON.stringify(u));
  document.getElementById("headerUserName").textContent = u.name || "Tài khoản";
  var roleBadge = document.getElementById("headerUserRole");
  var isSep = u.role === "sep";
  roleBadge.textContent = isSep ? "SẾP" : "NV";
  roleBadge.className = "role-badge " + (isSep ? "sep" : "nv");
  document.getElementById("btnTodayOwner").style.display = isSep ? "inline-flex" : "none";
  document.getElementById("authOverlay").style.display = "none";
}

window.showAccountMenu = function() {
  if (!currentUser) return;
  showPosModal(`
    <h3>👤 Tài Khoản Nhân Viên</h3>
    <div class="receipt-box">
      <div><b>Họ tên:</b> ${currentUser.name}</div>
      <div><b>Số điện thoại:</b> ${currentUser.phone}</div>
      <div><b>Quyền hạn:</b> <b style="color:${currentUser.role === 'sep' ? '#ffcc00' : 'var(--accent)'};">${currentUser.role === 'sep' ? 'SẾP (Toàn quyền)' : 'Nhân viên bán hàng'}</b></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-pay cash" style="flex:1;" onclick="logoutPOS()">Đăng xuất</button>
      <button class="btn-pay qr" style="flex:1;" onclick="closePosModal()">Đóng</button>

};

window.logoutPOS = function() {
  if (confirm("Đăng xuất khỏi POS?")) {
    localStorage.removeItem("tka_logged_user");
    location.reload();
  }
};

var saved = localStorage.getItem("tka_logged_user");
if (saved) {
  try { applyUser(JSON.parse(saved)); } catch (e) {}
} else {
  document.getElementById("authOverlay").style.display = "flex";
}

reloadInventory(false);
renderBill();
</script>
